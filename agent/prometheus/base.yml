global:
  scrape_interval: 15s
  external_labels:
    host: ${MON_HOST_NAME}
    role: ${MON_ROLE}

remote_write:
  - url: ${MON_ENDPOINT}
    authorization:
      type: Bearer
      credentials: ${MON_TOKEN}
    tls_config:
      insecure_skip_verify: ${MON_TLS_INSECURE}

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: dockerstats
    static_configs:
      - targets: ["127.0.0.1:9487"]
