name: itg-mon-central

networks:
  mon-net:
    driver: bridge

services:
  render:
    image: alpine:3.20
    container_name: mon-render
    env_file: .env
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache gettext >/dev/null
        envsubst '$$TELEGRAM_BOT_TOKEN $$TELEGRAM_CHAT_ID' \
          < /in/alertmanager.yml > /out/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml:/in/alertmanager.yml:ro
      - mon-config:/out
    networks:
      - mon-net

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mon-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-30d}
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - mon-net

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: mon-alertmanager
    restart: unless-stopped
    depends_on:
      render:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - mon-config:/etc/alertmanager
    networks:
      - mon-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: mon-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SERVER_ROOT_URL: https://${MON_DOMAIN:?MON_DOMAIN is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - mon-net

  caddy:
    image: caddy:2-alpine
    container_name: mon-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MON_DOMAIN: ${MON_DOMAIN:?MON_DOMAIN is required}
      MON_TOKEN: ${MON_TOKEN:?MON_TOKEN is required}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - grafana
      - prometheus
    networks:
      - mon-net

volumes:
  mon-config:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:
